name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Sync moving version tags
        if: ${{ steps.release.outputs.release_created == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MAJOR_VERSION="${PACKAGE_VERSION%%.*}"
          MINOR_VERSION="$(node -p "const [major, minor] = process.argv[1].split('.'); major + '.' + minor" "$PACKAGE_VERSION")"
          TARGET_SHA="${{ steps.release.outputs.sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${MAJOR_VERSION}" "$TARGET_SHA"
          git tag -f "v${MINOR_VERSION}" "$TARGET_SHA"
          git push --force origin "refs/tags/v${MAJOR_VERSION}" "refs/tags/v${MINOR_VERSION}"

      - name: Detect npm publish target
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        if: ${{ steps.release.outputs.release_created || steps.publish.outputs.needed == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.release_created && steps.release.outputs.sha || github.sha }}

      - name: Setup Node
        if: ${{ steps.release.outputs.release_created || steps.publish.outputs.needed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created || steps.publish.outputs.needed == 'true' }}
        run: npm ci

      - name: Verify package
        if: ${{ steps.release.outputs.release_created || steps.publish.outputs.needed == 'true' }}
        run: |
          npm run lint
          npm test
          npm run build
          npm pack --dry-run

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created || steps.publish.outputs.needed == 'true' }}
        run: npm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
